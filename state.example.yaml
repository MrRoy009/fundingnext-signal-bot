# Copy to state.yaml and keep it current from your competition account.
# The bot reads this before every ticket. If updated_at is older than
# risk.state_max_age_hours, every ticket is suppressed.
# Tickets the bot issued after updated_at are counted on top of this file (open positions,
# trades today, open risk) until you update it.
updated_at: "2026-11-02T08:00:00Z"
balance: 100000
equity: 100000
start_of_day_balance: 100000
start_of_day_equity: 100000
trades_today: 0
trading_days_completed: 0
open_positions: []
